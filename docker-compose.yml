services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_backend
    restart: unless-stopped
    tty: true
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www
    command: php artisan serve --host=0.0.0.0 --port=9000
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev